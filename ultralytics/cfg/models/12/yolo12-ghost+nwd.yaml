# YOLOv12 带有 GhostConv 的轻量化配置示例 (修复版)
nc: 80 # number of classes
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # YOLOv12n
  s: [0.50, 0.50, 1024] # YOLOv12s
  m: [0.50, 1.00, 512] # YOLOv12m
  l: [1.00, 1.00, 512] # YOLOv12l
  x: [1.00, 1.50, 512] # YOLOv12x

# YOLOv12 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2 (建议保留第一层为普通Conv，修正了疑似笔误的参数)
  - [-1, 1, GhostConv, [128, 3, 2]] # 1-P2/4 (补全参数: ch_out, k, s)
  - [-1, 2, C3k2, [128, False, 0.25]] # 2
  - [-1, 1, GhostConv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [256, False, 0.25]] # 4
  - [-1, 1, GhostConv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, False, 0.25]] # 6 (原缺失层 - 请替换为你需要的 Area Attention 模块)
  - [-1, 1, GhostConv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True, 0.25]] # 8 (原缺失层)
  - [-1, 1, SPPF, [1024, 5]] # 9 (原缺失层，通常 P5 尾部会接 SPPF 或类似的池化金字塔)

# YOLOv12 neck & head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[-1, 6], 1, Concat, [1]] # 11 cat backbone P4 (修正 Concat 维度为 1)
  - [-1, 2, C3k2, [512, False]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 4], 1, Concat, [1]] # 14 cat backbone P3 (修正 Concat 维度为 1)
  - [-1, 2, C3k2, [256, False]] # 15 (P3/8-small)

  - [-1, 1, GhostConv, [256, 3, 2]] # 16 (下采样卷积替换为 GhostConv，需带参数)
  - [[-1, 12], 1, Concat, [1]] # 17 cat head P4 (修正 Concat 维度为 1)
  - [-1, 2, C3k2, [512, False]] # 18 (P4/16-medium)

  - [-1, 1, GhostConv, [512, 3, 2]] # 19 (下采样卷积替换为 GhostConv，需带参数)
  - [[-1, 9], 1, Concat, [1]] # 20 cat head P5 (修正 Concat 维度为 1)
  - [-1, 2, C3k2, [1024, False]] # 21 (P5/32-large, 补全原缺失层)

  - [[15, 18, 21], 1, Detect, [nc]] # 22 Detect(P3, P4, P5) (将输入修正为 Neck 的实际输出层)
