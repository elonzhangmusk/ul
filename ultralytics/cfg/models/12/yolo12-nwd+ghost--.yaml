# YOLOv12 Hybrid 混合配置 (浅层 C3Ghost + 深层/Neck 标准模块)
nc: 80 # number of classes
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLOv12 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3Ghost, [128, False]] # 2 (浅层：保留 C3Ghost，节约大量算力)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3Ghost, [256, False]] # 4 (浅层：保留 C3Ghost)

  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C2f, [512, True]] # 6 (深层：换回 C2f 等高精度模块，增强语义提取)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C2f, [1024, True]] # 8 (深层：换回 C2f 等高精度模块)
  - [-1, 1, SPPF, [1024, 5]] # 9

# YOLOv12 neck & head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[-1, 6], 1, Concat, [1]] # 11 cat backbone P4
  - [-1, 2, C2f, [512, False]] # 12 (Neck：换回标准模块，保证特征融合质量)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 4], 1, Concat, [1]] # 14 cat backbone P3
  - [-1, 2, C2f, [256, False]] # 15 (Neck：换回标准模块)

  - [-1, 1, Conv, [256, 3, 2]] # 16
  - [[-1, 12], 1, Concat, [1]] # 17 cat head P4
  - [-1, 2, C2f, [512, False]] # 18 (Neck：换回标准模块)

  - [-1, 1, Conv, [512, 3, 2]] # 19
  - [[-1, 9], 1, Concat, [1]] # 20 cat head P5
  - [-1, 2, C2f, [1024, False]] # 21 (Neck：换回标准模块)

  - [[15, 18, 21], 1, Detect, [nc]] # 22 Detect(P3, P4, P5)
