# YOLOv12 + C3Ghost 轻量化配置 (保留标准下采样，替换特征提取模块)
nc: 80 # number of classes
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # YOLOv12n
  s: [0.50, 0.50, 1024] # YOLOv12s
  m: [0.50, 1.00, 512] # YOLOv12m
  l: [1.00, 1.00, 512] # YOLOv12l
  x: [1.00, 1.50, 512] # YOLOv12x

# YOLOv12 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2 (标准卷积下采样)
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4 (标准卷积下采样，保留特征)
  - [-1, 2, C3Ghost, [128, False]] # 2 (特征提取替换为轻量化 C3Ghost)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8 (标准卷积下采样)
  - [-1, 2, C3Ghost, [256, False]] # 4 (特征提取替换为轻量化 C3Ghost)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16 (标准卷积下采样)
  - [-1, 2, C3Ghost, [512, False]] # 6 (特征提取替换为轻量化 C3Ghost)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32 (标准卷积下采样)
  - [-1, 2, C3Ghost, [1024, True]] # 8 (特征提取替换为轻量化 C3Ghost)
  - [-1, 1, SPPF, [1024, 5]] # 9 (空间金字塔池化)

# YOLOv12 neck & head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[-1, 6], 1, Concat, [1]] # 11 cat backbone P4
  - [-1, 2, C3Ghost, [512, False]] # 12 (Neck特征融合替换为 C3Ghost)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 4], 1, Concat, [1]] # 14 cat backbone P3
  - [-1, 2, C3Ghost, [256, False]] # 15 (P3/8-small, Neck特征融合替换为 C3Ghost)

  - [-1, 1, Conv, [256, 3, 2]] # 16 (标准卷积下采样，保证特征传递)
  - [[-1, 12], 1, Concat, [1]] # 17 cat head P4
  - [-1, 2, C3Ghost, [512, False]] # 18 (P4/16-medium, Neck特征融合替换为 C3Ghost)

  - [-1, 1, Conv, [512, 3, 2]] # 19 (标准卷积下采样，保证特征传递)
  - [[-1, 9], 1, Concat, [1]] # 20 cat head P5
  - [-1, 2, C3Ghost, [1024, False]] # 21 (P5/32-large, Neck特征融合替换为 C3Ghost)

  - [[15, 18, 21], 1, Detect, [nc]] # 22 Detect(P3, P4, P5)
