# 任务与类别声明
task: detect
nc: 1  # 针对 EVD4UAV 数据集单类 (Car)

# 网络缩放比例 (基于 YOLO12n)
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]   # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4 (关键：降采样4倍的特征层)
  - [-1, 3, C3k2, [128, True]]  # 2 (这是高分辨率纹理特征，将被提取)
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 3, C3k2, [256, True]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 3, C3k2, [512, True]]  # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]]    # 9
  - [-1, 1, C2PSA, [1024]]      # 10 (全局注意力)

head:
  - [-1, 1, Conv, [512, 1, 1]]  # 11
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 12
  - [[-1, 6], 1, ASFF_Concat, [1]]   # 13 自适应融合 Backbone P4
  - [-1, 3, C3k2, [512, False]] # 14
  
  - [-1, 1, Conv, [256, 1, 1]]  # 15
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 16
  - [[-1, 4], 1, ASFF_Concat, [1]]   # 17 自适应融合 Backbone P3
  - [-1, 3, C3k2, [256, False]] # 18 

  # ==========================================
  # 【AHFF 核心】：P2 层自适应高分辨率特征融合
  # 专门针对无人机视角下被压缩到极致的微小像素级目标
  # ==========================================
  - [-1, 1, Conv, [128, 1, 1]]  # 19 
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 20 继续上采样到 256x256
  - [[-1, 2], 1, ASFF_Concat, [1]]   # 21 自适应融合 Backbone P2
  - [-1, 3, C3k2, [128, False]] # 22 -> 【第一路：P2 微小目标预测头输入】

  # ==========================================
  # PANet 下采样路径 (全部替换为空间自适应融合)
  # 解决高低频特征图直接拼接导致的语义冲突
  # ==========================================
  - [-1, 1, Conv, [128, 3, 2]]  # 23 下采样回到 P3 分辨率
  - [[-1, 18], 1, ASFF_Concat, [1]]  # 24 
  - [-1, 3, C3k2, [256, False]] # 25 -> 【第二路：P3 小目标预测头输入】

  - [-1, 1, Conv, [256, 3, 2]]  # 26 下采样回到 P4 分辨率
  - [[-1, 14], 1, ASFF_Concat, [1]]  # 27 
  - [-1, 3, C3k2, [512, False]] # 28 -> 【第三路：P4 中目标预测头输入】

  - [-1, 1, Conv, [512, 3, 2]]  # 29 下采样回到 P5 分辨率
  - [[-1, 11], 1, ASFF_Concat, [1]]  # 30 
  - [-1, 3, C3k2, [1024, False]] # 31 -> 【第四路：P5 大目标预测头输入】

  # ==========================================
  # 终极 Detect 头：接收 4 个尺度的特征图
  # ==========================================
  - [[22, 25, 28, 31], 1, Detect, [nc]] # Detect (P2, P3, P4, P5)