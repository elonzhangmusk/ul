# YOLOv12-C3Ghost-EMA 轻量化高精度配置
nc: 80 # number of classes
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLOv12 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3Ghost, [128, False]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3Ghost, [256, False]] # 4 (Backbone P3)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3Ghost, [512, False]] # 6 (Backbone P4)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3Ghost, [1024, True]] # 8 (Backbone P5)

  # 👇 在最深层特征提取后、SPPF 前插入 EMA 注意力机制
  - [-1, 1, EMA, [1024]] # 9
  - [-1, 1, SPPF, [1024, 5]] # 10 (原索引为9，现顺延为10)

# YOLOv12 neck & head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4 (索引6不变)
  - [-1, 2, C3Ghost, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3 (索引4不变)
  - [-1, 2, C3Ghost, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 17
  - [[-1, 13], 1, Concat, [1]] # 18 cat head P4 (原12，修正为13)
  - [-1, 2, C3Ghost, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 20
  - [[-1, 10], 1, Concat, [1]] # 21 cat head P5 (🌟重要：原9，修正为SPPF层的10)
  - [-1, 2, C3Ghost, [1024, False]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # 23 Detect(P3, P4, P5) (原15,18,21，修正为16,19,22)
