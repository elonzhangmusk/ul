# YOLO12 Ghost / NWD 混合配置，用于轻量化与小目标回归联合实验。
task: detect
nc: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, GhostConv, [128, 3, 2]]
  - [-1, 2, C3Ghost, [128, False]]
  - [-1, 1, GhostConv, [256, 3, 2]]
  - [-1, 2, C3Ghost, [256, False]]
  - [-1, 1, GhostConv, [512, 3, 2]]
  - [-1, 2, C3Ghost, [512, False]]
  - [-1, 1, GhostConv, [1024, 3, 2]]
  - [-1, 2, C3Ghost, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3Ghost, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3Ghost, [256, False]]
  - [-1, 1, GhostConv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 2, C3Ghost, [512, False]]
  - [-1, 1, GhostConv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 2, C3Ghost, [1024, False]]
  - [[15, 18, 21], 1, Detect, [nc]]
