# YOLO12 P2 分支配置，用于提升无人机视角下极小目标的检测能力。
task: detect
nc: 1
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]   # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 3, C3k2, [128, True]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 3, C3k2, [256, True]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 3, C3k2, [512, True]]  # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]]    # 9
  - [-1, 1, C2PSA, [1024]]      # 10

head:
  - [-1, 1, Conv, [512, 1, 1]]  # 11
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 12
  - [[-1, 6], 1, ASFF_Concat, [1]]   # 13
  - [-1, 3, C3k2, [512, False]] # 14

  - [-1, 1, Conv, [256, 1, 1]]  # 15
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 16
  - [[-1, 4], 1, ASFF_Concat, [1]]   # 17
  - [-1, 3, C3k2, [256, False]] # 18

  - [-1, 1, Conv, [128, 1, 1]]  # 19
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 20
  - [[-1, 2], 1, ASFF_Concat, [1]]   # 21
  - [-1, 3, C3k2, [128, False]] # 22

  - [-1, 1, Conv, [128, 3, 2]]  # 23
  - [[-1, 18], 1, ASFF_Concat, [1]]  # 24
  - [-1, 3, C3k2, [256, False]] # 25

  - [-1, 1, Conv, [256, 3, 2]]  # 26
  - [[-1, 14], 1, ASFF_Concat, [1]]  # 27
  - [-1, 3, C3k2, [512, False]] # 28

  - [-1, 1, Conv, [512, 3, 2]]  # 29
  - [[-1, 11], 1, ASFF_Concat, [1]]  # 30
  - [-1, 3, C3k2, [1024, False]] # 31

  - [[22, 25, 28, 31], 1, Detect, [nc]] # 32
